name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bash and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          shellcheck_version=$(<.shellcheck-version)
          [[ $shellcheck_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck" \
            "$RUNNER_TEMP/shellcheck"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check Bash syntax
        run: bash -n a2dpilot tests/a2dpilot_test.sh tests/run_shellcheck.sh

      - name: Run ShellCheck
        run: ./tests/run_shellcheck.sh

      - name: Run regression tests
        run: ./tests/a2dpilot_test.sh
